name: Ensemble bot

on:
  schedule:
    - cron: "35 13 * * 1-5"   # 9:35 ET in summer (EDT)
    - cron: "35 14 * * 1-5"   # 9:35 ET in winter (EST)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-bots
  cancel-in-progress: false

defaults:
  run:
    working-directory: trading-bots

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-bots/requirements.txt
      - run: pip install -r requirements.txt

      # Keep the price cache between runs so only new days are downloaded
      - uses: actions/cache@v4
        with:
          path: trading-bots/data_cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run the bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python -m ensemble.run ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save the log to the repo
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "Ensemble log $(date -u +%F)"
          git pull --rebase --autostash && git push

name: MA crossover bot

on:
  schedule:
    # GitHub runs schedules in UTC. 9:30 ET is 13:30 UTC in summer (EDT)
    # and 14:30 UTC in winter (EST). Both fire; the bot's time-window check
    # makes the wrong one exit without trading.
    - cron: "30 13 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:        # "Run workflow" button for a manual test

permissions:
  contents: write           # lets the job save its log back to the repo

concurrency:
  group: trading-bots       # never two bots pushing logs at the same moment
  cancel-in-progress: false

defaults:
  run:
    working-directory: trading-bots

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-bots/requirements.txt
      - run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python -m ma_crossover.bot ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save the log to the repo
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "MA crossover log $(date -u +%F)"
          git pull --rebase --autostash && git push

name: MA crossover bot

on:
  schedule:
    # GitHub runs schedules in UTC: 13:35 UTC is 9:35 ET in summer (EDT),
    # 14:35 UTC is 9:35 ET in winter (EST). Minute 35 avoids the :00/:30 rush
    # that delays scheduled runs. The bot's 9:25-14:00 ET window skips a run
    # that lands before the open; a second run on the same day trades nothing new.
    - cron: "35 13 * * 1-5"
    - cron: "35 14 * * 1-5"
  workflow_dispatch:        # "Run workflow" button for a manual test

permissions:
  contents: write           # lets the job save its log back to the repo

concurrency:
  group: trading-bots       # never two bots pushing logs at the same moment
  cancel-in-progress: false

defaults:
  run:
    working-directory: trading-bots

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-bots/requirements.txt
      - run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python -m ma_crossover.bot ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save the log to the repo
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "MA crossover log $(date -u +%F)"
          git pull --rebase --autostash && git push

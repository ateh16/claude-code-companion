name: MA crossover bot

on:
  schedule:
    # GitHub runs schedules in UTC and often starts them late (on 2026-10-26 by
    # six hours) or not at all, so there are four tries a day. Minute 35 avoids
    # the :00/:30 rush. ET times, summer (EDT) / winter (EST):
    - cron: "35 13 * * 1-5"   #  9:35 AM / 8:35 AM (winter: before the window, exits)
    - cron: "35 14 * * 1-5"   # 10:35 AM / 9:35 AM
    - cron: "35 16 * * 1-5"   # 12:35 PM / 11:35 AM  (backup)
    - cron: "35 18 * * 1-5"   #  2:35 PM / 1:35 PM   (backup)
    # The bot trades only 9:25 AM-3:45 PM ET; later runs of the same day find
    # nothing to do.
  workflow_dispatch:        # "Run workflow" button for a manual test

permissions:
  contents: write           # lets the job save its log back to the repo

concurrency:
  group: ${{ github.workflow }}   # one run of each bot at a time; the bots don't block each other
  cancel-in-progress: false

defaults:
  run:
    working-directory: trading-bots

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-bots/requirements.txt
      - run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: "true"
        run: python -m ma_crossover.bot ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Save the log to the repo
        if: always()
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet || git commit -m "MA crossover log $(date -u +%F)"
          # the other bot may push its log at the same moment: retry a few times
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep $((i * 5)); done; git push   # red run if the log still is not saved

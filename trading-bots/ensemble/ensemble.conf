# Four-program ensemble bot settings

[assets]
sp500 = SPY
nasdaq = QQQ
international = EFA        # developed markets outside the US (data from 2001)
bonds = IEF                # 7-10 year US Treasuries (data from 2002)
history_start = 2000-01-01
cache_dir = data_cache

[weights]                  # share of the final vote; must add up to 1.0
p1_trend = 0.40
p2_momentum = 0.20
p3_dip = 0.20
p4_ml = 0.20

[p1_trend]                 # Program 1: NASDAQ above its 200-day average, sized by volatility
sma_days = 200
vol_days = 20
target_vol = 0.20          # full position when yearly volatility <= 20%, smaller above that

[p2_momentum]              # Program 2: once a month, US vs international, else bonds
lookback_days = 252

[p3_dip]                   # Program 3: buy a sharp 2-day drop while the trend is up
drop_days = 2
drop_pct = 0.03            # fall of at least 3% over 2 days
trend_sma_days = 200
max_hold_days = 10         # give up if no bounce within 10 days

[p4_ml]                    # Program 4: gradient boosting, read contrarian
horizon_days = 5
pessimistic_below = 0.50   # buy when the model's chance of "up in 5 days" is below this
min_train_days = 750       # about 3 years of history before the model is trusted
max_iter = 200
max_depth = 3
learning_rate = 0.05
backtest_retrain_every = 21  # live runs always retrain from scratch; the backtest retrains monthly to stay fast

[trading]
min_trade_pct = 0.01       # skip trades smaller than 1% of the account
fractional = true          # trade dollar amounts (fractional shares)

[schedule]
run_window_start = 09:25
run_window_end = 10:25

[backtest]
start = 2004-01-01
out_of_sample_years = 6
cost_bps = 2               # trading cost per $ traded, in basis points
results_dir = backtest_results

[logging]
log_file = logs/ensemble.log

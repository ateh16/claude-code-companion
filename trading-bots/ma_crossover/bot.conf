# Moving average crossover bot settings
# Change these and the bot picks them up on its next run.

[strategy]
symbol = AAPL
short_window = 20          # fast moving average, in trading days
long_window = 50           # slow moving average, in trading days
lookback_days = 100        # how many days of history to fetch

[trading]
trade_size = 1             # shares per order
allow_short = false        # false = a sell signal only sells shares you already own

[schedule]
# The bot only trades inside this New York time window (open to 15 minutes
# before the close). GitHub often starts scheduled runs late, sometimes by
# hours, so the workflows fire several times a day; every run after the first
# finds nothing to do (orders are never repeated on the same day).
run_window_start = 09:25
run_window_end = 15:45

[logging]
log_file = logs/ma_crossover.log

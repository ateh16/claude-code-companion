# Mid-cap growth momentum screen

[universe]
min_market_cap = 2000000000      # $2 billion
max_market_cap = 10000000000     # $10 billion
min_price = 10
min_quarterly_revenue_growth_pct = 15   # revenue up at least 15% vs a year ago
max_candidates = 500
# Optional: if Yahoo's screener is unavailable, list your own tickers here, one per line
universe_file = stock_picker/universe.txt

[momentum]
long_days = 252        # 12-month momentum...
skip_days = 21         # ...skipping the most recent month (standard 12-1 momentum)
medium_days = 126      # 6-month momentum
min_avg_dollar_volume = 10000000   # at least $10M traded per day
max_above_200d_pct = 100   # skip names already more than 100% above their 200-day average
shortlist = 40         # how many top-momentum names get a fundamentals check

[output]
top_n = 3
max_per_industry = 1  # e.g. at most one oil tanker company in the top 3
report_dir = reports
